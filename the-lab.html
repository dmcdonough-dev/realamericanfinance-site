            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

                    <button onclick="openToolModal('01')" class="w-full bg-crimson/10 border border-crimson/30 py-3 text-[10px] font-bold uppercase tracking-widest hover:bg-crimson transition">Enter Module</button>

    <div id="tool-modal" class="modal-overlay hidden">
        <div class="modal-container">
            <button onclick="closeToolModal()" class="absolute top-6 right-8 text-3xl text-gray-500 hover:text-white z-50">&times;</button>
            <div id="modal-content-inject" class="w-full">
                </div>
        </div>
    </div>

    <script>
        // CORE MODAL ENGINE
        async function openToolModal(pillarId) {
            const modal = document.getElementById('tool-modal');
            const container = document.getElementById('modal-content-inject');
            const file = `pillar-${pillarId}.html`;

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            container.innerHTML = `<div class="p-40 text-center"><i class="fas fa-spinner text-4xl text-crimson"></i></div>`;

            try {
                const response = await fetch(file);
                const html = await response.text();
                container.innerHTML = html;

                // CRITICAL FIX: This wakes up your calculation logic inside the popup
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                });

                // Trigger the Pillar's calculation engine
                setTimeout(() => {
                    if (window.initTool) window.initTool();
                    else if (window.calculateAll) window.calculateAll();
                }, 300);

            } catch (err) {
                container.innerHTML = `<div class="p-40 text-center text-crimson uppercase font-bold tracking-widest">Tactical Error: Module Not Found</div>`;
            }
        }

        function closeToolModal() {
            document.getElementById('tool-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
            document.getElementById('modal-content-inject').innerHTML = '';
        }

    </script>
