<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lab | Real American Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .hero-bg { background: linear-gradient(rgba(5,11,20,0.8), rgba(5,11,20,0.8)), url('./flag_distressed.jpg'); background-size: cover; background-position: center; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .dashboard-card { background: #0A1A2F; border: 1px solid rgba(255,255,255,0.05); }
        .input-underlined { border-bottom: 1px solid rgba(255,255,255,0.1); background: transparent; outline: none; transition: border-color 0.3s; color: white; }
        .input-underlined:focus { border-color: #B22234; }
        
        .tier-1 { border-left: 4px solid #FFFFFF; background: rgba(255,255,255,0.04); }
        .tier-2 { border-left: 4px solid #9ca3af; background: rgba(156,163,175,0.04); }
        .tier-3 { border-left: 4px solid #4b5563; background: rgba(255,255,255,0.02); transition: all 0.5s ease; }
        
        .assets-box { border-left: 4px solid #B22234; background: rgba(178, 34, 52, 0.1); }

        .perc-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 800; letter-spacing: 0.1em; transition: all 0.3s; }
        .status-good { background: rgba(0, 255, 0, 0.3); color: white; }
        .status-ok { background: rgba(255, 255, 0, 0.3); color: black; }
        .status-bad { background: #B22234; color: white; box-shadow: 0 0 10px rgba(178, 34, 52, 0.5); }

        .high-interest-alert { animation: pulse 1.5s infinite; color: #B22234; font-weight: 900; font-size: 9px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .war-mode-active { border-left-color: #B22234 !important; background: rgba(178, 34, 52, 0.15) !important; opacity: 0.5; pointer-events: none; }
        .war-mode-active h4 { color: #B22234 !important; text-shadow: 0 0 10px rgba(178,34,52,0.5); }
        .war-mode-flash { animation: flash 2s; }
        @keyframes flash { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .threat-critical { background: #B22234; color: white; animation: pulse 2s infinite; font-weight: 900; text-shadow: 0 0 10px rgba(178,34,52,0.8); }
        .threat-high { background: #DC143C; color: white; }
        .threat-elevated { background: #FF8C00; color: black; }
        .threat-guarded { background: #1E90FF; color: white; }
        .threat-sovereign { background: #00FF00; color: black; font-weight: 900; }

        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1 0 auto; }
        footer { flex-shrink: 0; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Oswald', 'sans-serif'] }, colors: { navy: { 950: '#050B14', 900: '#0A1A2F', 800: '#11243F' }, crimson: '#B22234' } } }
        }
    </script>
</head>
<body class="bg-navy-950 text-white font-sans selection:bg-crimson flex flex-col min-h-screen">
    
    <!-- header, hero, sovereignty score with breakdown, monthly inflow, debt recon, current assets, siege engine all unchanged from last version -->

    <main class="container mx-auto px-6 py-12 flex-1">
        <!-- ... all previous sections ... -->

        <!-- UPGRADED Priority Target -->
        <div class="mt-20 dashboard-card p-12 border-t-8 border-crimson shadow-2xl">
            <h3 class="text-3xl font-heading font-bold uppercase mb-8 text-white tracking-tight">Priority Targets</h3>
            
            <div class="mb-8 text-center">
                <div id="threat-level" class="inline-block px-8 py-4 text-2xl font-heading uppercase tracking-widest">LOADING THREAT ASSESSMENT</div>
            </div>

            <div id="priority-orders" class="space-y-6 text-lg">
                <p class="text-center text-gray-400 italic">Awaiting intelligence...</p>
            </div>

            <div class="mt-8 text-center">
                <button id="war-mode-trigger" onclick="toggleWarMode()" class="hidden bg-crimson hover:bg-red-700 px-8 py-4 text-xl font-bold uppercase tracking-widest transition shadow-lg">Initiate War-Mode</button>
            </div>

            <div class="mt-10 text-center">
                <p id="battle-cry" class="text-xl font-heading uppercase tracking-wider text-gray-400 italic"></p>
            </div>
        </div>
    </main>

    <!-- footer unchanged -->

    <script>
        // ... all previous vars and functions ...

        function calculateAll() {
            // ... all previous calculations (income, dMin, dTotal, t1, t2, t3, essentials, monthlySurplus, current assets, auto housing, etc.)

            // 5-Pillar Scores (same as before)
            // ... (budget, debt, emergency, retirement, realestate scoring)

            const totalScore = Math.round(scoreBudget + scoreDebt + scoreEmergency + scoreRetirement + scoreRealEstate);
            // ... update sovereignty score and sub-scores

            // === THREAT LEVEL ===
            let threatLevel = "";
            let threatClass = "";
            if (totalScore < 40) {
                threatLevel = "CRITICAL BREACH";
                threatClass = "threat-critical";
            } else if (totalScore < 60) {
                threatLevel = "HIGH ALERT";
                threatClass = "threat-high";
            } else if (totalScore < 80) {
                threatLevel = "ELEVATED";
                threatClass = "threat-elevated";
            } else if (totalScore < 90) {
                threatLevel = "GUARDED";
                threatClass = "threat-guarded";
            } else {
                threatLevel = "SOVEREIGN";
                threatClass = "threat-sovereign";
            }
            document.getElementById('threat-level').innerText = threatLevel;
            document.getElementById('threat-level').className = `inline-block px-8 py-4 text-2xl font-heading uppercase tracking-widest ${threatClass}`;

            // === BATTLE CRY ===
            let cry = "";
            if (totalScore < 40) cry = "Fortress under siege. Immediate action required.";
            else if (totalScore < 60) cry = "Holding the line. Reinforce weak flanks.";
            else if (totalScore < 80) cry = "Steady advance. Maintain discipline.";
            else if (totalScore < 90) cry = "Strong position. Prepare for offensive.";
            else cry = "Sovereignty achieved. Deploy capital strategically.";
            document.getElementById('battle-cry').innerText = cry;

            // === TOP 3 PRIORITY TARGETS ===
            const pillars = [
                { name: "Budgeting", score: scoreBudget, tip: getBudgetTip(needsPerc, wantsPerc, surplusPerc, income) },
                { name: "Debt", score: scoreDebt, tip: getDebtTip(dTotal, monthlySurplus, income) },
                { name: "Emergency Fund", score: scoreEmergency, tip: getEmergencyTip(moatMonths, essentials, monthlySurplus) },
                { name: "Retirement", score: scoreRetirement, tip: getRetirementTip(age, currentRetirement, annualIncome) },
                { name: "Real Estate", score: scoreRealEstate, tip: getRealEstateTip(monthlyHousing, income, equity) }
            ];

            pillars.sort((a, b) => a.score - b.score);
            const top3 = pillars.slice(0, 3);

            let ordersHTML = "";
            top3.forEach((p, i) => {
                ordersHTML += `
                    <div class="bg-navy-900/50 border border-white/10 p-6 rounded">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-crimson font-bold uppercase tracking-wider">#${i+1} ${p.name.toUpperCase()}</span>
                            <span class="text-2xl font-bold">${Math.round(p.score)}/20</span>
                        </div>
                        <p class="text-gray-300 leading-relaxed">${p.tip}</p>
                    </div>`;
            });

            document.getElementById('priority-orders').innerHTML = ordersHTML;

            // Show War-Mode button if Budgeting weak
            const warBtn = document.getElementById('war-mode-trigger');
            if (scoreBudget < 12 || surplusPerc < 15) {
                warBtn.classList.remove('hidden');
            } else {
                warBtn.classList.add('hidden');
            }

            // ... chart update, etc.
        }

        function getBudgetTip(needs, wants, surplus, income) {
            if (needs > 50) return `Needs at ${Math.round(needs)}%. Cut housing, food, or transport by $${Math.round((needs - 50)/100 * income)}/month.`;
            if (wants > 30) return `Wants at ${Math.round(wants)}%. Reduce Cargo spending by $${Math.round((wants - 30)/100 * income)}/month.`;
            if (surplus < 20) return `Only ${Math.round(surplus)}% surplus. Free up $${Math.round((20 - surplus)/100 * income)}/month for attack.`;
            return "Budget disciplined. Maintain course.";
        }

        function getDebtTip(dTotal, surplus, income) {
            if (dTotal === 0) return "Debt free. Outstanding.";
            const months = surplus > 0 ? Math.ceil(dTotal / surplus) : "Never";
            return `$${dTotal.toLocaleString()} total debt. With current surplus: freedom in ${months} months. Accelerate payoff.`;
        }

        function getEmergencyTip(months, essentials, surplus) {
            if (months >= 6) return "Iron Pot strong. 6+ months covered.";
            const target = essentials * 3;
            const needed = target - currentIronPot;
            return `Only ${months.toFixed(1)} months covered. Build to 3 months ($${target.toLocaleString()}). Redirect $${Math.round(needed / 12)}/month.`;
        }

        function getRetirementTip(age, current, annual) {
            const multiplier = age <= 30 ? 1 : age <= 40 ? 3 : age <= 50 ? 6 : age <= 60 ? 8 : 10;
            const target = annual * multiplier;
            if (current >= target) return "Retirement on track for age.";
            return `Target for age ${age}: $${target.toLocaleString()}. Current: $${current.toLocaleString()}. Increase contributions.`;
        }

        function getRealEstateTip(housingCost, income, equity) {
            const ratio = (housingCost / income) * 100;
            if (ratio <= 28 && equity >= 0) return "Housing affordable and building equity.";
            let msg = "";
            if (ratio > 28) msg += `Housing ${Math.round(ratio)}% of income (ideal ≤28%). `;
            if (equity < 0) msg += "Underwater on mortgage. ";
            return msg || "Real estate position stable.";
        }

        // ... rest of script unchanged
    </script>
</body>
</html>
